<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Xuất Dữ Liệu Pixel</title>
</head>
<body>
    <h2>Chọn ảnh để tự động xuất dữ liệu pixel ra file JS/JSON</h2>
    <input type="file" id="upload" accept="image/*">

    <script>
        document.getElementById('upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);

                    // Lấy dữ liệu điểm ảnh
                    const imgData = ctx.getImageData(0, 0, img.width, img.height);
                    const pixels = Array.from(imgData.data);

                    // Tạo nội dung file JavaScript
                    const fileContent = `// Tổng số pixel: ${img.width * img.height}\nconst pixelData = ${JSON.stringify(pixels)};`;

                    // Tự động tạo link tải file về máy
                    const blob = new Blob([fileContent], { type: 'text/javascript' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'pixelData.js';
                    a.click();
                    URL.revokeObjectURL(url);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
