<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>A Little Thing For You</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#02030a;font-family:Georgia,serif}
#scene{position:relative;width:100%;height:100%;
background:radial-gradient(circle at 50% 45%,#111c3d 0%,#050713 58%,#010207 100%)}
canvas{position:absolute;inset:0;width:100%;height:100%}
#start{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
width:100px;height:100px;border:0;border-radius:50%;
background:rgba(255,105,180,.18);backdrop-filter:blur(10px);font-size:48px;
cursor:pointer;box-shadow:0 0 25px #ff69b4,0 0 60px rgba(255,105,180,.5);
animation:beat 1.2s infinite;z-index:10}
@keyframes beat{
0%,100%{transform:translate(-50%,-50%) scale(1)}
15%{transform:translate(-50%,-50%) scale(1.15)}
30%{transform:translate(-50%,-50%) scale(1)}
45%{transform:translate(-50%,-50%) scale(1.12)}
60%{transform:translate(-50%,-50%) scale(1)}
}
#message{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
width:90%;text-align:center;color:#fff;opacity:0;transition:opacity 2s;
z-index:20;pointer-events:none}
.main{font-size:clamp(30px,4vw,56px);font-weight:bold;
text-shadow:0 0 10px #fff,0 0 25px #ff8fbd,0 0 50px #ff5fa8}
.sub{margin-top:10px;font-size:clamp(14px,1.5vw,22px);line-height:1.5}
</style>
</head>
<body>
<div id="scene">
<canvas id="canvas"></canvas>
<button id="start">💖</button>
<div id="message"></div>
<div id="error" style="position:absolute;left:50%;top:70%;transform:translateX(-50%);color:#fff;text-align:center;font:14px Arial;z-index:30;display:none"></div>
</div>

<!-- This is numerical pixel data, NOT the original photo. -->
<script src="facePixels_cutout_grayscale.js"></script>
<script>window.__facePixelsLoaded = true;</script>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const start=document.getElementById("start");
const message=document.getElementById("message");

let W=innerWidth,H=innerHeight,DPR=1;

function resize(){
    W=innerWidth; H=innerHeight;
    DPR=Math.min(devicePixelRatio||1,2);
    canvas.width=W*DPR;
    canvas.height=H*DPR;
    canvas.style.width=W+"px";
    canvas.style.height=H+"px";
    ctx.setTransform(DPR,0,0,DPR,0,0);
}
resize();
addEventListener("resize",resize);

const N=4500;
const particles=[];

function seed(i){
    const x=Math.sin(i*127.1+17.7)*43758.5453;
    return x-Math.floor(x);
}

for(let i=0;i<N;i++){
    particles.push({
        size:.45+seed(i*3+1)*1.5,
        phase:seed(i*3+2)*Math.PI*2,
        x:seed(i*5+3),
        y:seed(i*5+4)
    });
}

/* Background stars */
const bg=[];
for(let i=0;i<350;i++){
    bg.push({
        x:Math.random(),y:Math.random(),
        r:.3+Math.random()*1.4,
        p:Math.random()*Math.PI*2,
        s:.5+Math.random()*2
    });
}

function drawBG(now=performance.now()){
    for(const q of bg){
        const a=.2+.75*(.5+.5*Math.sin(now*.001*q.s+q.p));
        ctx.fillStyle=`rgba(255,255,255,${a})`;
        ctx.beginPath();
        ctx.arc(q.x*W,q.y*H,q.r,0,Math.PI*2);
        ctx.fill();
    }
}

function sleep(ms){
    return new Promise(r=>setTimeout(r,ms));
}

function ease(p){
    return p<.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;
}

function getScale(){
    return Math.min(W/5.1,H/7);
}

function dot(x,y,r,color,alpha=1){
    ctx.globalAlpha=alpha;
    ctx.fillStyle=color;
    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fill();
    ctx.globalAlpha=1;
}

/* Sky positions */
function sky(i){
    return {
        x:(particles[i].x-.5)*14,
        y:(particles[i].y-.5)*9
    };
}

/* Fixed galaxy positions */
const galaxy=[];

for(let i=0;i<N;i++){
    const arm=i%5;
    const base=arm*Math.PI*2/5;
    const radius=.15+Math.pow(seed(i*11+4),.68)*6;
    const angle=base+radius*.9+(seed(i*13+7)-.5)*.65;
    const thickness=(seed(i*17+8)-.5)*(.25+radius*.18);

    galaxy.push({
        x:Math.cos(angle)*(radius+thickness),
        y:Math.sin(angle)*(radius+thickness)*.47
    });
}


/* Decode the separate numerical pixel file */
const portrait=[];

(function decodeFace(){
    const binary=atob(window.facePixelData);

    for(let i=0;i<binary.length;i+=4){
        const gx=binary.charCodeAt(i);
        const gy=binary.charCodeAt(i+1);
        const lum=binary.charCodeAt(i+2);
        const alpha=binary.charCodeAt(i+3);

        portrait.push({gx,gy,lum,alpha});
    }
})();

/*
   The portrait is now ONLY foreground pixels.
   No original image is loaded.
*/
function face(i){
    const p=portrait[i];
    const gw=window.facePixelGrid.width;
    const gh=window.facePixelGrid.height;

    return {
        x:(p.gx/(gw-1)-.5)*5.0,
        y:(p.gy/(gh-1)-.5)*(5.0*gw/gh)
    };
}

function faceColor(i){
    const p=portrait[i];
    return `rgb(${p.lum},${p.lum},${p.lum})`;
}

/* =========================
   OPTIMIZED MORPH RENDERER
   ========================= */

const FACE_COLORS = [];
for(let i=0;i<16;i++){
    const v=Math.round(i*255/15);
    FACE_COLORS.push(`rgb(${v},${v},${v})`);
}

const GAL_COLORS=[
    "#ffffff","#e9efff","#b9c9ff",
    "#ffd9ed","#fff1fa","#9eb7ff"
];

const HEART_COLORS=[
    "#ffffff","#fff2f8","#ffd8e8",
    "#ffb6d1","#ff8fbd","#ff6ba9"
];

/* Precompute all shape coordinates once.
   This avoids recalculating 4500 trigonometric operations
   on every animation frame. */
const skyX=new Float32Array(N);
const skyY=new Float32Array(N);

for(let i=0;i<N;i++){
    skyX[i]=(particles[i].x-.5)*14;
    skyY[i]=(particles[i].y-.5)*9;
}

const galX=new Float32Array(N);
const galY=new Float32Array(N);

for(let i=0;i<N;i++){
    const arm=i%5;
    const base=arm*Math.PI*2/5;
    const radius=.15+Math.pow(seed(i*11+4),.68)*6;
    const angle=base+radius*.9+(seed(i*13+7)-.5)*.65;
    const thickness=(seed(i*17+8)-.5)*(.25+radius*.18);

    galX[i]=Math.cos(angle)*(radius+thickness);
    galY[i]=Math.sin(angle)*(radius+thickness)*.47;
}

const heartX=new Float32Array(N);
const heartY=new Float32Array(N);

for(let i=0;i<N;i++){
    const t=Math.PI*2*i/N;

    heartX[i]=16*Math.sin(t)**3*.18;
    heartY[i]=-(13*Math.cos(t)
        -5*Math.cos(2*t)
        -2*Math.cos(3*t)
        -Math.cos(4*t))*.18;
}

const faceX=new Float32Array(N);
const faceY=new Float32Array(N);
const faceLum=new Uint8Array(N);

(function prepareFace(){
    const gw=window.facePixelGrid.width;
    const gh=window.facePixelGrid.height;

    for(let i=0;i<N;i++){
        const p=portrait[i];

        faceX[i]=(p.gx/(gw-1)-.5)*5.0;
        faceY[i]=(p.gy/(gh-1)-.5)*(5.0*gw/gh);
        faceLum[i]=p.lum;
    }
})();

function drawMorph(fromX,fromY,toX,toY,p,mode,rot=0,scaleMultiplier=1){

    const sc=getScale()*scaleMultiplier;
    const cos=Math.cos(rot);
    const sin=Math.sin(rot);

    let palette;

    if(mode==="face") palette=FACE_COLORS;
    else if(mode==="heart") palette=HEART_COLORS;
    else palette=GAL_COLORS;

    const bins=palette.length;
    const paths=new Array(bins);

    for(let i=0;i<bins;i++){
        paths[i]=new Path2D();
    }

    for(let i=0;i<N;i++){

        let x=fromX[i]+(toX[i]-fromX[i])*p;
        let y=fromY[i]+(toY[i]-fromY[i])*p;

        if(rot){
            const rx=x*cos-y*sin;
            const ry=x*sin+y*cos;
            x=rx;
            y=ry;
        }

        const px=W/2+x*sc;
        const py=H/2+y*sc;
        const r=particles[i].size;

        let bin;

        if(mode==="face"){
            bin=Math.min(
                bins-1,
                Math.floor(faceLum[i]/256*bins)
            );
        }else{
            bin=i%bins;
        }

        paths[bin].moveTo(px+r,py);
        paths[bin].arc(px,py,r,0,Math.PI*2);
    }

    for(let i=0;i<bins;i++){
        ctx.fillStyle=palette[i];
        ctx.fill(paths[i]);
    }
}

function drawBackgroundStars(now){
    for(const q of bg){
        const a=.18+.7*(
            .5+.5*Math.sin(now*.001*q.s+q.p)
        );

        ctx.globalAlpha=a;
        ctx.fillStyle="#ffffff";
        ctx.beginPath();
        ctx.arc(q.x*W,q.y*H,q.r,0,Math.PI*2);
        ctx.fill();
    }

    ctx.globalAlpha=1;
}

/* Stars appear */
function reveal(){
    return new Promise(resolve=>{
        const t0=performance.now();
        const duration=3200;

        function frame(now){
            const p=Math.min((now-t0)/duration,1);
            const e=1-Math.pow(1-p,3);

            ctx.clearRect(0,0,W,H);
            drawBackgroundStars(now);

            for(let i=0;i<N;i++){
                const q=particles[i];

                const a=e*(
                    .18+.82*(
                        .5+.5*Math.sin(
                            now*.002+q.phase
                        )
                    )
                );

                ctx.globalAlpha=a;
                ctx.fillStyle="#ffffff";
                ctx.beginPath();
                ctx.arc(
                    q.x*W,
                    q.y*H,
                    q.size,
                    0,
                    Math.PI*2
                );
                ctx.fill();
            }

            ctx.globalAlpha=1;

            if(p<1)requestAnimationFrame(frame);
            else resolve();
        }

        requestAnimationFrame(frame);
    });
}

/* Sky -> galaxy: shrink + rotate */
function galaxyAnimation(){
    return new Promise(resolve=>{
        const t0=performance.now();
        const duration=5200;

        function frame(now){
            const p=Math.min((now-t0)/duration,1);
            const e=ease(p);

            ctx.clearRect(0,0,W,H);
            drawBackgroundStars(now);

            drawMorph(
                skyX,skyY,
                galX,galY,
                e,
                "gal",
                e*Math.PI*2.25
            );

            if(p<1)requestAnimationFrame(frame);
            else resolve();
        }

        requestAnimationFrame(frame);
    });
}

/* Generic morph */
function animate(from,to,duration,options={}){
    return new Promise(resolve=>{
        const t0=performance.now();

        let fromX,fromY,toX,toY,mode;

        if(from==="gal" && to==="face"){
            fromX=galX; fromY=galY;
            toX=faceX; toY=faceY;
            mode="face";
        }
        else if(from==="face" && to==="heart"){
            fromX=faceX; fromY=faceY;
            toX=heartX; toY=heartY;
            mode="heart";
        }
        else if(from==="heart" && to==="heart"){
            fromX=heartX; fromY=heartY;
            toX=heartX; toY=heartY;
            mode="heart";
        }
        else{
            throw new Error("Unknown animation");
        }

        function frame(now){
            const p=Math.min((now-t0)/duration,1);

            ctx.clearRect(0,0,W,H);
            drawBackgroundStars(now);

            drawMorph(
                fromX,fromY,
                toX,toY,
                ease(p),
                mode,
                0,
                options.scale||1
            );

            if(p<1)requestAnimationFrame(frame);
            else resolve();
        }

        requestAnimationFrame(frame);
    });
}

/* Heartbeat */
async function heartbeat(){
    for(let i=0;i<3;i++){
        await animate(
            "heart","heart",220,
            {scale:1.12,color:heartColor}
        );

        await animate(
            "heart","heart",360,
            {scale:1,color:heartColor}
        );

        await sleep(180);
    }
}

/* Story */
async function run(){

    start.style.display="none";

    ctx.clearRect(0,0,W,H);
    drawBG();

    /* 1. Quiet sky */
    await sleep(1800);

    /* 2. Many stars */
    await reveal();

    /* 3. Shrink + rotate into galaxy */
    await galaxyAnimation();

    await sleep(900);

    /* 4. Galaxy -> REAL PIXEL COORDINATES */
    await animate(
        "gal",
        "face",
        5600
    );

    /* Hold portrait */
    await sleep(3200);

    /* 5. Face -> heart */
    await animate(
        "face",
        "heart",
        4800
    );

    /* 6. Heart beats */
    await heartbeat();

    /* 7. Message */
    message.innerHTML=`
        <div class="main">I like you.</div>
        <div class="sub">
            That's all.<br>
            I just wanted you to know.
        </div>
    `;

    message.style.opacity="1";
}


function showError(text){
    const el=document.getElementById("error");
    el.textContent=text;
    el.style.display="block";
}

if(
    !window.__facePixelsLoaded ||
    !window.facePixelData ||
    !window.facePixelGrid ||
    !window.facePixelCount
){
    start.disabled=true;
    start.style.opacity=".4";
    showError("Không tải được facePixels.js — hãy đặt 2 file cùng một thư mục.");
}else{
    try{
        if(portrait.length !== N){
            throw new Error("Số pixel không đúng: "+portrait.length);
        }
    }catch(e){
        start.disabled=true;
        start.style.opacity=".4";
        showError("Lỗi dữ liệu pixel: "+e.message);
    }
}

start.addEventListener("click",()=>{
    if(start.disabled) return;
    run().catch(err=>{
        console.error(err);
        showError("Animation error: "+err.message);
    });
});


ctx.clearRect(0,0,W,H);
drawBG();

</script>
</body>
</html>
