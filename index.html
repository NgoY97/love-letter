<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Portrait Galaxy Animation</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#010207;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}

#info{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  color:rgba(255,255,255,.45);
  font-family:Arial,sans-serif;
  font-size:13px;
  letter-spacing:1px;
  pointer-events:none;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div id="info">
  SKY → PORTRAIT GALAXY → NEW GALAXY
</div>

<!-- Nạp file dữ liệu 4500 điểm ảnh của bạn -->
<script src="pixelData.js"></script>

<script>
/* =========================================================
   CANVAS SETUP
========================================================= */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", { alpha: false });

let W = innerWidth;
let H = innerHeight;
let DPR = 1;

function resize(){
  W = innerWidth;
  H = innerHeight;
  DPR = Math.min(devicePixelRatio || 1, 1.5);

  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();
addEventListener("resize", resize);

/* =========================================================
   PARTICLE COUNT & STATE
========================================================= */
const N = (typeof pixelData !== 'undefined') ? pixelData.length : 4500;

const state = {
  x: new Float32Array(N),
  y: new Float32Array(N),
  vx: new Float32Array(N),
  vy: new Float32Array(N),
  size: new Float32Array(N),
  phase: new Float32Array(N),
  speed: new Float32Array(N),
  brightness: new Float32Array(N)
};

/* =========================================================
   TARGET POSITIONS (GALAXY 1: PORTRAIT, GALAXY 2: NEW GALAXY)
========================================================= */
const galaxy1X = new Float32Array(N);
const galaxy1Y = new Float32Array(N);
const galaxy2X = new Float32Array(N);
const galaxy2Y = new Float32Array(N);

function hash(i, n){
  const x = Math.sin(i * 127.1 + n * 311.7) * 43758.5453;
  return x - Math.floor(x);
}

// 1. Chuyển dữ liệu 4500 điểm ảnh portrait thành tọa độ mục tiêu (Galaxy 1)
function setupPortraitTargets() {
  const imgW = typeof imageWidth !== 'undefined' ? imageWidth : 300;
  const imgH = typeof imageHeight !== 'undefined' ? imageHeight : 300;
  const scale = 5.0 / Math.max(imgW, imgH); // Đưa về hệ tọa độ thế giới (-2.5 đến 2.5)

  for (let i = 0; i < N; i++) {
    if (typeof pixelData !== 'undefined' && pixelData[i]) {
      // Căn giữa tọa độ ảnh
      galaxy1X[i] = (pixelData[i].x - imgW / 2) * scale;
      galaxy1Y[i] = (pixelData[i].y - imgH / 2) * scale;
    } else {
      galaxy1X[i] = (hash(i, 1) - 0.5) * 4;
      galaxy1Y[i] = (hash(i, 2) - 0.5) * 4;
    }
  }
}

// 2. Cấu trúc Thiên hà ngẫu nhiên mới (Galaxy 2)
function createGalaxy2() {
  for (let i = 0; i < N; i++) {
    const arm = i % 4;
    const radius = 0.15 + Math.pow(hash(i, 50), 0.72) * 6.2;
    const angle = arm * Math.PI / 2 + radius * 0.88 + (hash(i, 51) - 0.5) * 0.42;
    const thickness = (hash(i, 52) - 0.5) * (0.18 + radius * 0.14);
    const r = radius + thickness;

    galaxy2X[i] = Math.cos(angle) * r;
    galaxy2Y[i] = Math.sin(angle) * r * 0.55;
  }
}

setupPortraitTargets();
createGalaxy2();

/* =========================================================
   INITIAL SKY STATE
========================================================= */
for(let i = 0; i < N; i++){
  state.x[i] = (hash(i, 3) - 0.5) * 14;
  state.y[i] = (hash(i, 4) - 0.5) * 9;
  state.vx[i] = 0;
  state.vy[i] = 0;

  state.size[i] = 0.45 + hash(i, 1) * 1.45;
  state.phase[i] = hash(i, 2) * Math.PI * 2;
  state.speed[i] = 0.0007 + hash(i, 8) * 0.002;

  const r = hash(i, 9);
  if(r < 0.10) state.brightness[i] = 1.35;
  else if(r < 0.40) state.brightness[i] = 1.05;
  else if(r < 0.90) state.brightness[i] = 0.78;
  else state.brightness[i] = 0.55;
}

/* =========================================================
   BACKGROUND STARS & RENDERING
========================================================= */
const bg = [];
for(let i = 0; i < 350; i++){
  bg.push({
    x: Math.random(),
    y: Math.random(),
    r: 0.2 + Math.random() * 0.9,
    phase: Math.random() * Math.PI * 2,
    speed: 0.0004 + Math.random() * 0.0015
  });
}

function drawBackground(now){
  const gradient = ctx.createRadialGradient(W * 0.5, H * 0.45, 0, W * 0.5, H * 0.45, Math.max(W, H) * 0.72);
  gradient.addColorStop(0, "#121d42");
  gradient.addColorStop(0.52, "#050713");
  gradient.addColorStop(1, "#010207");

  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, W, H);

  for(const s of bg){
    const twinkle = 0.5 + 0.5 * Math.sin(now * s.speed + s.phase);
    ctx.globalAlpha = 0.10 + twinkle * 0.32;
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* =========================================================
   MATH HELPERS & TRANSITIONS
========================================================= */
function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
function smooth(p){ p = clamp(p, 0, 1); return p * p * p * (p * (p * 6 - 15) + 10); }
function lerp(a, b, p){ return a + (b - a) * p; }
function worldScale(){ return Math.min(W / 5.8, H / 5.8); }

function updateSkyToGalaxy(progress){
  const p = smooth(progress);

  for(let i = 0; i < N; i++){
    const tx = galaxy1X[i];
    const ty = galaxy1Y[i];

    const dx = tx - state.x[i];
    const dy = ty - state.y[i];

    const attraction = 0.00065 + p * 0.0045;
    state.vx[i] += dx * attraction;
    state.vy[i] += dy * attraction;

    const swirl = 0.0015 + p * 0.010;
    state.vx[i] += -state.y[i] * swirl;
    state.vy[i] += state.x[i] * swirl;

    state.vx[i] *= 0.965;
    state.vy[i] *= 0.965;

    state.x[i] += state.vx[i];
    state.y[i] += state.vy[i];

    if(p > 0.72){
      const lock = (p - 0.72) / 0.28;
      state.x[i] = lerp(state.x[i], tx, lock * 0.018);
      state.y[i] = lerp(state.y[i], ty, lock * 0.018);
    }
  }
}

function updateGalaxyToGalaxy(progress){
  const p = smooth(progress);

  for(let i = 0; i < N; i++){
    const expansion = 1 + p * 1.9;
    const oldX = galaxy1X[i] * expansion;
    const oldY = galaxy1Y[i] * expansion;

    const targetX = lerp(oldX, galaxy2X[i], p);
    const targetY = lerp(oldY, galaxy2Y[i], p);

    const dx = targetX - state.x[i];
    const dy = targetY - state.y[i];

    const attraction = 0.0008 + p * 0.0042;
    state.vx[i] += dx * attraction;
    state.vy[i] += dy * attraction;

    const swirl = 0.003 + p * 0.010;
    state.vx[i] += -state.y[i] * swirl;
    state.vy[i] += state.x[i] * swirl;

    state.vx[i] *= 0.965;
    state.vy[i] *= 0.965;

    state.x[i] += state.vx[i];
    state.y[i] += state.vy[i];
  }
}

/* =========================================================
   DRAW PARTICLES
========================================================= */
function drawParticles(now){
  const s = worldScale() * 0.92;
  const paths = Array.from({ length: 6 }, () => new Path2D());

  for(let i = 0; i < N; i++){
    const px = W / 2 + state.x[i] * s;
    const py = H / 2 + state.y[i] * s;

    const wave = 0.5 + 0.5 * Math.sin(now * state.speed[i] + state.phase[i]);
    const twinkle = 0.30 + wave * 0.70;
    const brightness = twinkle * state.brightness[i];
    const r = state.size[i] * (0.72 + brightness * 0.28);

    let bin;
    if(brightness > 1.15) bin = 5;
    else if(brightness > 0.95) bin = 4;
    else if(brightness > 0.78) bin = 3;
    else if(brightness > 0.60) bin = 2;
    else if(brightness > 0.42) bin = 1;
    else bin = 0;

    paths[bin].moveTo(px + r, py);
    paths[bin].arc(px, py, r, 0, Math.PI * 2);
  }

  const colors = ["#8f9abb", "#b9c5e8", "#d6ddff", "#e7ebff", "#f4f5ff", "#ffffff"];

  for(let i = 0; i < 6; i++){
    ctx.globalAlpha = i === 5 ? 1 : 0.92;
    ctx.fillStyle = colors[i];
    ctx.fill(paths[i]);
  }
  ctx.globalAlpha = 1;
}

/* =========================================================
   TIMELINE & ANIMATION LOOP
========================================================= */
const SKY_TIME = 4500;
const SKY_TO_GALAXY = 6500;
const GALAXY_TO_NEW = 8000;
const START = performance.now();

function frame(now){
  const elapsed = now - START;

  drawBackground(now);

  if(elapsed < SKY_TIME){
    // Giai đoạn 1: Giữ nguyên vị trí sao nhấp nháy
  } else if(elapsed < SKY_TIME + SKY_TO_GALAXY){
    // Giai đoạn 2: Xoáy vào hình Chân dung của bạn
    const p = (elapsed - SKY_TIME) / SKY_TO_GALAXY;
    updateSkyToGalaxy(p);
  } else if(elapsed < SKY_TIME + SKY_TO_GALAXY + GALAXY_TO_NEW){
    // Giai đoạn 3: Từ chân dung bung ra Dải thiên hà mới
    const p = (elapsed - SKY_TIME - SKY_TO_GALAXY) / GALAXY_TO_NEW;
    updateGalaxyToGalaxy(p);
  }

  drawParticles(now);
  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>

</body>
</html>
