<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Thing For You</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02030a;
    font-family:Georgia,serif;
}

#scene{
    width:100%;
    height:100%;
    position:relative;

    background:
    radial-gradient(
        circle at center,
        #121d3f 0%,
        #050713 60%,
        #010207 100%
    );
}

canvas{
    position:absolute;
    inset:0;
}

#start{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:100px;
  height:100px;
  border-radius:50%;
  border:none;
  background:rgba(255,105,180,.2);
  backdrop-filter:blur(10px);
  font-size:48px;
  cursor:pointer;
  box-shadow:0 0 25px hotpink;
  animation:heartbeat 1.2s infinite;
}
@keyframes heartbeat{

  0%{
    transform:
      translate(-50%,-50%)
      scale(1);
  }

  15%{
    transform:
      translate(-50%,-50%)
      scale(1.15);
  }

  30%{
    transform:
      translate(-50%,-50%)
      scale(1);
  }

  45%{
    transform:
      translate(-50%,-50%)
      scale(1.12);
  }

  60%{
    transform:
      translate(-50%,-50%)
      scale(1);
  }

  100%{
    transform:
      translate(-50%,-50%)
      scale(1);
  }
}

#message{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    color:white;
    opacity:0;
    transition:opacity 2s ease;
    pointer-events:none;
    z-index:10;
}

#message .main{
    font-size:clamp(30px,4vw,56px);
    font-weight:bold;

    text-shadow:
        0 0 10px white,
        0 0 25px hotpink,
        0 0 50px hotpink;
}

#message .sub{
    margin-top:10px;
    font-size:clamp(14px,1.5vw,22px);
}


.small{
    display:block;
    margin-top:15px;
    font-size:.6em;
    opacity:.8;
}
</style>
</head>

<body>

<div id="scene">

    <canvas id="canvas"></canvas>

    <button id="start">💖</button>

    <div id="message"></div>

</div>

<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const startButton=document.getElementById("start");
const message=document.getElementById("message");

let W,H;

function resize(){
    W=window.innerWidth;
    H=window.innerHeight;

    canvas.width=W;
    canvas.height=H;
}
resize();

window.addEventListener("resize",resize);

const stars=[];

for(let i=0;i<500;i++){

    stars.push({
        x:Math.random()*W,
        y:Math.random()*H,
        r:Math.random()*1.5,
        phase:Math.random()*6.28
    });

}

function drawStars(){

    const now=performance.now();

    for(const s of stars){

        let a=.5+.5*Math.sin(now*0.001+s.phase);

        ctx.fillStyle=`rgba(255,255,255,${a})`;

        ctx.beginPath();
        ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
        ctx.fill();
    }

}

const particles=[];
const flowerCenters=[];

function createFlowers(){

    flowerCenters.length=0;

    for(let i=0;i<120;i++){

        flowerCenters.push({

            x:Math.random()*14-7,
            y:Math.random()*8-4,

            size:0.15+Math.random()*1.2

        });

    }

}

function createParticles(){

    particles.length=0;

    for(let i=0;i<4500;i++){

        particles.push({

            size:0.6+Math.random()*2.2,
            phase:Math.random()*6.28

        });

    }

}
function galaxyShape(i,n){

    const t = i * 0.15;

    const r = (i / n) * 8;

    return {
        x: Math.cos(t) * r,
        y: Math.sin(t) * r
    };
}
function portraitShape(i,n){

    const t = i / n;

    // viền mặt
    if(t < 0.45){

        const a = (t / 0.45) * Math.PI * 2;

        return{
            x: Math.cos(a) * 1.6,
            y: Math.sin(a) * 2.1
        };
    }

    // kính trái
    if(t < 0.60){

        const a =
        ((t - 0.45) / 0.15) *
        Math.PI * 2;

        return{
            x: -0.65 + Math.cos(a) * 0.45,
            y: -0.25 + Math.sin(a) * 0.35
        };
    }

    // kính phải
    if(t < 0.75){

        const a =
        ((t - 0.60) / 0.15) *
        Math.PI * 2;

        return{
            x: 0.65 + Math.cos(a) * 0.45,
            y: -0.25 + Math.sin(a) * 0.35
        };
    }

    // cầu kính
    if(t < 0.82){

        const p = (t - 0.75) / 0.07;

        return{
            x: -0.2 + p * 0.4,
            y: -0.25
        };
    }

    // vai vest
    const p = (t - 0.82) / 0.18;

    return{
        x: (p * 5) - 2.5,
        y: 2.4 - Math.abs(p - 0.5)
    };
}

function heartShape(i,n){

    const t = Math.PI*2*i/n;

    return{

        x:(16*Math.sin(t)**3)*0.22,

        y:(
        -(13*Math.cos(t)
        -5*Math.cos(2*t)
        -2*Math.cos(3*t)
        -Math.cos(4*t))
        )*0.22
    };
}
async function heartBeat(){

    for(let k=0;k<3;k++){

        await animateShape(
            heartShape,
            heartShape,
            400
        );

        await sleep(300);

    }
}

const colors=[
"#ffd6e7",
"#ffbad4",
"#ff9ac3",
"#ff6fad",
"#fff3fa"
];

function drawMorph(from,to,progress){

    const scale=Math.min(W,H)/3.5;

    for(let i=0;i<particles.length;i++){

        const a=from(i,particles.length);
        const b=to(i,particles.length);

        const xShape=
            a.x*(1-progress)+
            b.x*progress;

        const yShape=
            a.y*(1-progress)+
            b.y*progress;

        const x=W/2+xShape*scale;
        const y=H/2+yShape*scale;

        ctx.fillStyle=
        colors[i%colors.length];

        ctx.shadowBlur=14;
        ctx.shadowColor=
        colors[i%colors.length];

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            particles[i].size,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.shadowBlur=0;
}

function sleep(ms){
    return new Promise(
        r=>setTimeout(r,ms)
    );
}

function animateShape(from,to,duration){

    return new Promise(resolve=>{

        const startTime =
        performance.now();

        function frame(now){

            const p = Math.min(
                (now-startTime)/duration,
                1
            );

            ctx.clearRect(0,0,W,H);

            drawStars();

            drawMorph(
                from,
                to,
                p
            );

            if(p < 1){

                requestAnimationFrame(frame);

            }else{

                resolve();

            }
        }

        requestAnimationFrame(frame);

    });

}

function animateHeart(){

    return new Promise(resolve=>{

        const startTime=performance.now();

        function frame(now){

            let p=Math.min(
                (now-startTime)/5000,
                1
            );

            ctx.clearRect(0,0,W,H);

            drawStars();

            drawMorph(
                flowerShape,
                heartShape,
                p
            );

            if(p<1){
                requestAnimationFrame(frame);
            }else{
                resolve();
            }

        }

        requestAnimationFrame(frame);

    });

}

function showMessage(text){

    message.innerHTML=text;
    message.style.opacity=1;

}

function hideMessage(){

    message.style.opacity=0;

}

async function run(){

    startButton.style.display="none";

    createParticles();

    // Sao trời

    drawStars();

    await sleep(2500);

    // Thiên hà

    await animateShape(
        heartShape,
        galaxyShape,
        4000
    );

    // Chân dung bằng sao

    await animateShape(
        galaxyShape,
        portraitShape,
        5000
    );

    await sleep(4000);

    // Chân dung thành trái tim

    await animateShape(
        portraitShape,
        heartShape,
        5000
    );

    await heartBeat();

    message.innerHTML = `
      <div class="main">I like you.</div>
      <div class="sub">
        That's all.<br>
        I just wanted you to know.
      </div>
    `;

    message.style.opacity = 1;
}

startButton.addEventListener(
    "click",
    run
);

</script>

</body>
</html>
