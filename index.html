<!doctype html>

<html lang="en">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>A Little Thing For You</title>

<style>

:root {

  --bg: #02030a;

  --text: #ffffff;

}

* {

  box-sizing: border-box;

}

html, body {

  margin: 0;

  width: 100%;

  height: 100%;

  overflow: hidden;

  background: var(--bg);

}

body {

  font-family: Georgia, "Times New Roman", serif;

}

#scene {

  position: relative;

  width: 100%;

  height: 100%;

  background:

    radial-gradient(

      circle at 50% 45%,

      #11182f 0%,

      #050713 45%,

      #010207 100%

    );

}

canvas {

  position: absolute;

  inset: 0;

  width: 100%;

  height: 100%;

}

#start {

  position: absolute;

  left: 50%;

  top: 50%;

  transform: translate(-50%, -50%);

  padding: 14px 34px;

  border: 1px solid rgba(255,255,255,.55);

  border-radius: 999px;

  background: rgba(255,255,255,.05);

  color: #fff;

  letter-spacing: 4px;

  font-size: 13px;

  cursor: pointer;

  backdrop-filter: blur(8px);

}

#start:hover {

  background: rgba(255,255,255,.12);

}

#message {

  position: absolute;

  left: 50%;

  top: 50%;

  transform: translate(-50%, -50%);

  width: min(90%,720px);

  text-align: center;

  color: #fff;

  opacity: 0;

  font-size: clamp(20px,3vw,32px);

  line-height: 1.75;

  letter-spacing: 1px;

  text-shadow: 0 0 25px rgba(255,255,255,.25);

  transition: opacity 2s ease;

  pointer-events: none;

}

#message .small {

  display: block;

  margin-top: 20px;

  font-size: .62em;

  opacity: .78;

}

</style>

</head>

<body>

<div id="scene">

  <canvas id="canvas"></canvas>

  <button id="start">START</button>

  <div id="message"></div>

</div>

<script>

const SETTINGS = {

  flowerDuration: 8000,

  heartDuration: 6000,

  pauseAfterFlower: 900,

  pauseAfterHeart: 1200,

  textHold: 4000,

  skyTransition: 3500,

  particles: 1800,

  stars: 700

};

const TEXT = {

  first: "Some things are easier to create than to say.",

  second: "So I'll just say it.",

  final: "I like you.",

  finalSmall: "That's all. I just wanted you to know."

};

const canvas = document.getElementById("canvas");

const ctx = canvas.getContext("2d");

const startButton = document.getElementById("start");

const message = document.getElementById("message");

let W = 0;

let H = 0;

let DPR = 1;

let stars = [];

let particles = [];

let running = false;

function resize() {

  DPR = Math.min(window.devicePixelRatio || 1, 2);

  W = window.innerWidth;

  H = window.innerHeight;

  canvas.width = W * DPR;

  canvas.height = H * DPR;

  canvas.style.width = W + "px";

  canvas.style.height = H + "px";

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

}

window.addEventListener("resize", resize);

resize();

function rand(min, max) {

  return min + Math.random() * (max - min);

}

function ease(t) {

  return t < 0.5

    ? 2 * t * t

    : 1 - Math.pow(-2 * t + 2, 2) / 2;

}

function makeStars() {

  stars = [];

  for (let i = 0; i < SETTINGS.stars; i++) {

    stars.push({

      x: Math.random() * W,

      y: Math.random() * H,

      r: rand(.15, 1.35),

      alpha: rand(.2, .9),

      phase: Math.random() * Math.PI * 2

    });

  }

}

makeStars();

function drawStars(alpha = 1) {

  const now = performance.now();

  for (const s of stars) {

    const twinkle =

      .65 + .35 * Math.sin(now / 650 + s.phase);

    ctx.fillStyle =

      `rgba(255,255,255,${s.alpha * twinkle * alpha})`;

    ctx.beginPath();

    ctx.arc(

      s.x,

      s.y,

      s.r,

      0,

      Math.PI * 2

    );

    ctx.fill();

  }

}

function flowerPoint(i, n) {

  const t = Math.PI * 2 * i / n;

  const r = 2.35 * Math.cos(5 * t);

  return {

    x: r * Math.cos(t),

    y: r * Math.sin(t)

  };

}

function heartPoint(i, n) {

  const t = Math.PI * 2 * i / n;

  const x = 16 * Math.sin(t) ** 3;

  const y =

    -(13 * Math.cos(t)

    - 5 * Math.cos(2 * t)

    - 2 * Math.cos(3 * t)

    - Math.cos(4 * t));

  return {

    x: x * .16,

    y: y * .16

  };

}

function initParticles() {

  particles = [];

  const n = SETTINGS.particles;

  for (let i = 0; i < n; i++) {

    const angle =

      Math.random() * Math.PI * 2;

    const radius =

      Math.pow(Math.random(), .55)

      * Math.max(W, H) * .5;

    particles.push({

      sx:

        W / 2 +

        Math.cos(angle) * radius,

      sy:

        H / 2 +

        Math.sin(angle) * radius,

      size: rand(.35, 1.7),

      phase:

        Math.random() * Math.PI * 2

    });

  }

}

function drawShape(shapeFunction, progress) {

  const n = particles.length;

  const e = ease(progress);

  const scale = Math.min(W, H) / 4.5;

  for (let i = 0; i < n; i++) {

    const p = particles[i];

    const q = shapeFunction(i, n);

    const tx =

      W / 2 + q.x * scale;

    const ty =

      H / 2 + q.y * scale;

    const x =

      p.sx * (1 - e) + tx * e;

    const y =

      p.sy * (1 - e) + ty * e;

    const pulse =

      .75 +

      .25 *

      Math.sin(

        performance.now() / 500 + p.phase

      );

    const alpha =

      .2 + .72 * e;

    ctx.fillStyle =

      `rgba(255,255,255,${alpha})`;

    ctx.shadowBlur =

      14 * pulse * e;

    ctx.shadowColor =

      "rgba(255,255,255,.8)";

    ctx.beginPath();

    ctx.arc(

      x,

      y,

      p.size * (.7 + 1.15 * e),

      0,

      Math.PI * 2

    );

    ctx.fill();

  }

  ctx.shadowBlur = 0;

}

function runPhase(duration, shapeFunction) {

  return new Promise(resolve => {

    const start = performance.now();

    function frame(now) {

      const progress =

        Math.min(

          (now - start) / duration,

          1

        );

      ctx.fillStyle =

        "rgba(2,3,10,.18)";

      ctx.fillRect(

        0,

        0,

        W,

        H

      );

      drawStars(.28);

      drawShape(

        shapeFunction,

        progress

      );

      if (progress < 1) {

        requestAnimationFrame(frame);

      } else {

        resolve();

      }

    }

    requestAnimationFrame(frame);

  });

}

function sleep(ms) {

  return new Promise(

    resolve => setTimeout(resolve, ms)

  );

}

function showText(html) {

  message.innerHTML = html;

  message.style.opacity = 1;

}

function hideText() {

  message.style.opacity = 0;

}

async function run() {

  if (running) return;

  running = true;

  startButton.style.opacity = 0;

  startButton.style.pointerEvents = "none";

  hideText();

  initParticles();

  ctx.fillStyle = "#02030a";

  ctx.fillRect(

    0,

    0,

    W,

    H

  );

  await sleep(500);

  // 1. Flower

  await runPhase(

    SETTINGS.flowerDuration,

    flowerPoint

  );

  await sleep(

    SETTINGS.pauseAfterFlower

  );

  // 2. Heart

  await runPhase(

    SETTINGS.heartDuration,

    heartPoint

  );

  await sleep(

    SETTINGS.pauseAfterHeart

  );

  // 3. First message

  showText(

    `${TEXT.first}

     <span class="small">

       ${TEXT.second}

     </span>`

  );

  await sleep(

    SETTINGS.textHold

  );

  hideText();

  // 4. Return to starry sky

  await sleep(1200);

  const transitionStart =

    performance.now();

  await new Promise(resolve => {

    function sky(now) {

      const p =

        Math.min(

          (now - transitionStart)

          / SETTINGS.skyTransition,

          1

        );

      ctx.fillStyle =

        `rgba(2,3,10,${.1 + .18 * p})`;

      ctx.fillRect(

        0,

        0,

        W,

        H

      );

      drawStars(p);

      if (p < 1) {

        requestAnimationFrame(sky);

      } else {

        resolve();

      }

    }

    requestAnimationFrame(sky);

  });

  await sleep(500);

  // 5. Final confession

  showText(

    `${TEXT.final}

     <span class="small">

       ${TEXT.finalSmall}

     </span>`

  );

}

startButton.addEventListener(

  "click",

  run

);

</script>

</body>

</html>
