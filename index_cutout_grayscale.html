<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>A Little Thing For You</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#02030a;font-family:Georgia,serif}
#scene{position:relative;width:100%;height:100%;
background:radial-gradient(circle at 50% 45%,#111c3d 0%,#050713 58%,#010207 100%)}
canvas{position:absolute;inset:0;width:100%;height:100%}
#start{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
width:100px;height:100px;border:0;border-radius:50%;
background:rgba(255,105,180,.18);backdrop-filter:blur(10px);font-size:48px;
cursor:pointer;box-shadow:0 0 25px #ff69b4,0 0 60px rgba(255,105,180,.5);
animation:beat 1.2s infinite;z-index:10}
@keyframes beat{
0%,100%{transform:translate(-50%,-50%) scale(1)}
15%{transform:translate(-50%,-50%) scale(1.15)}
30%{transform:translate(-50%,-50%) scale(1)}
45%{transform:translate(-50%,-50%) scale(1.12)}
60%{transform:translate(-50%,-50%) scale(1)}
}
#message{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
width:90%;text-align:center;color:#fff;opacity:0;transition:opacity 2s;
z-index:20;pointer-events:none}
.main{font-size:clamp(30px,4vw,56px);font-weight:bold;
text-shadow:0 0 10px #fff,0 0 25px #ff8fbd,0 0 50px #ff5fa8}
.sub{margin-top:10px;font-size:clamp(14px,1.5vw,22px);line-height:1.5}
</style>
</head>
<body>
<div id="scene">
<canvas id="canvas"></canvas>
<button id="start">💖</button>
<div id="message"></div>
</div>

<!-- This is numerical pixel data, NOT the original photo. -->
<script src="facePixels_cutout_grayscale.js"></script>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const start=document.getElementById("start");
const message=document.getElementById("message");

let W=innerWidth,H=innerHeight,DPR=1;

function resize(){
    W=innerWidth; H=innerHeight;
    DPR=Math.min(devicePixelRatio||1,2);
    canvas.width=W*DPR;
    canvas.height=H*DPR;
    canvas.style.width=W+"px";
    canvas.style.height=H+"px";
    ctx.setTransform(DPR,0,0,DPR,0,0);
}
resize();
addEventListener("resize",resize);

const N=4500;
const particles=[];

function seed(i){
    const x=Math.sin(i*127.1+17.7)*43758.5453;
    return x-Math.floor(x);
}

for(let i=0;i<N;i++){
    particles.push({
        size:.45+seed(i*3+1)*1.5,
        phase:seed(i*3+2)*Math.PI*2,
        x:seed(i*5+3),
        y:seed(i*5+4)
    });
}

/* Background stars */
const bg=[];
for(let i=0;i<700;i++){
    bg.push({
        x:Math.random(),y:Math.random(),
        r:.3+Math.random()*1.4,
        p:Math.random()*Math.PI*2,
        s:.5+Math.random()*2
    });
}

function drawBG(now=performance.now()){
    for(const q of bg){
        const a=.2+.75*(.5+.5*Math.sin(now*.001*q.s+q.p));
        ctx.fillStyle=`rgba(255,255,255,${a})`;
        ctx.beginPath();
        ctx.arc(q.x*W,q.y*H,q.r,0,Math.PI*2);
        ctx.fill();
    }
}

function sleep(ms){
    return new Promise(r=>setTimeout(r,ms));
}

function ease(p){
    return p<.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;
}

function getScale(){
    return Math.min(W/5.1,H/7);
}

function dot(x,y,r,color,alpha=1){
    ctx.globalAlpha=alpha;
    ctx.fillStyle=color;
    ctx.shadowBlur=4+r*4;
    ctx.shadowColor=color;
    ctx.beginPath();
    ctx.arc(x,y,r,0,Math.PI*2);
    ctx.fill();
    ctx.globalAlpha=1;
}

/* Sky positions */
function sky(i){
    return {
        x:(particles[i].x-.5)*14,
        y:(particles[i].y-.5)*9
    };
}

/* Fixed galaxy positions */
const galaxy=[];

for(let i=0;i<N;i++){
    const arm=i%5;
    const base=arm*Math.PI*2/5;
    const radius=.15+Math.pow(seed(i*11+4),.68)*6;
    const angle=base+radius*.9+(seed(i*13+7)-.5)*.65;
    const thickness=(seed(i*17+8)-.5)*(.25+radius*.18);

    galaxy.push({
        x:Math.cos(angle)*(radius+thickness),
        y:Math.sin(angle)*(radius+thickness)*.47
    });
}

function gal(i){return galaxy[i]}

/* Heart */
const heartColors=[
    "#ffffff","#fff2f8","#ffd8e8",
    "#ffb6d1","#ff8fbd","#ff6ba9"
];

function heart(i){
    const t=Math.PI*2*i/N;
    return {
        x:16*Math.sin(t)**3*.18,
        y:-(13*Math.cos(t)-5*Math.cos(2*t)
        -2*Math.cos(3*t)-Math.cos(4*t))*.18
    };
}

function heartColor(i){
    return heartColors[i%heartColors.length];
}

/* Decode the separate numerical pixel file */
const portrait=[];

(function decodeFace(){
    const binary=atob(window.facePixelData);

    for(let i=0;i<binary.length;i+=4){
        const gx=binary.charCodeAt(i);
        const gy=binary.charCodeAt(i+1);
        const lum=binary.charCodeAt(i+2);
        const alpha=binary.charCodeAt(i+3);

        portrait.push({gx,gy,lum,alpha});
    }
})();

/*
   The portrait is now ONLY foreground pixels.
   No original image is loaded.
*/
function face(i){
    const p=portrait[i];
    const gw=window.facePixelGrid.width;
    const gh=window.facePixelGrid.height;

    return {
        x:(p.gx/(gw-1)-.5)*5.0,
        y:(p.gy/(gh-1)-.5)*(5.0*gw/gh)
    };
}

function faceColor(i){
    const p=portrait[i];
    return `rgb(${p.lum},${p.lum},${p.lum})`;
}

/* Morph */
function morph(from,to,p,options={}){
    const sc=getScale()*(options.scale||1);
    const rot=options.rot||0;
    const color=options.color||(()=>"#fff");
    const alpha=options.alpha===undefined?1:options.alpha;

    const cos=Math.cos(rot);
    const sin=Math.sin(rot);

    for(let i=0;i<N;i++){
        const A=from(i);
        const B=to(i);

        let x=A.x+(B.x-A.x)*p;
        let y=A.y+(B.y-A.y)*p;

        if(rot){
            const rx=x*cos-y*sin;
            const ry=x*sin+y*cos;
            x=rx;y=ry;
        }

        dot(
            W/2+x*sc,
            H/2+y*sc,
            particles[i].size,
            color(i),
            alpha
        );
    }

    ctx.shadowBlur=0;
}

/* Stars appear */
function reveal(){
    return new Promise(resolve=>{
        const t0=performance.now();
        const duration=3200;

        function frame(now){
            const p=Math.min((now-t0)/duration,1);
            const e=1-Math.pow(1-p,3);

            ctx.clearRect(0,0,W,H);
            drawBG(now);

            for(let i=0;i<N;i++){
                const q=particles[i];

                const a=e*(
                    .18+.82*(
                        .5+.5*Math.sin(
                            now*.002+q.phase
                        )
                    )
                );

                dot(
                    q.x*W,
                    q.y*H,
                    q.size,
                    "#fff",
                    a
                );
            }

            if(p<1)requestAnimationFrame(frame);
            else resolve();
        }

        requestAnimationFrame(frame);
    });
}

/* Sky -> galaxy: shrink + rotate */
function galaxyAnimation(){
    return new Promise(resolve=>{
        const t0=performance.now();
        const duration=5200;

        function frame(now){
            const p=Math.min((now-t0)/duration,1);
            const e=ease(p);

            ctx.clearRect(0,0,W,H);
            drawBG(now);

            morph(
                sky,
                gal,
                e,
                {
                    rot:e*Math.PI*2.25,
                    color:galColor
                }
            );

            if(p<1)requestAnimationFrame(frame);
            else resolve();
        }

        requestAnimationFrame(frame);
    });
}

/* Generic morph */
function animate(from,to,duration,options={}){
    return new Promise(resolve=>{
        const t0=performance.now();

        function frame(now){
            const p=Math.min((now-t0)/duration,1);

            ctx.clearRect(0,0,W,H);
            drawBG(now);

            morph(
                from,
                to,
                ease(p),
                options
            );

            if(p<1)requestAnimationFrame(frame);
            else resolve();
        }

        requestAnimationFrame(frame);
    });
}

/* Heartbeat */
async function heartbeat(){
    for(let i=0;i<3;i++){
        await animate(
            heart,heart,220,
            {scale:1.12,color:heartColor}
        );

        await animate(
            heart,heart,360,
            {scale:1,color:heartColor}
        );

        await sleep(180);
    }
}

/* Story */
async function run(){

    start.style.display="none";

    ctx.clearRect(0,0,W,H);
    drawBG();

    /* 1. Quiet sky */
    await sleep(1800);

    /* 2. Many stars */
    await reveal();

    /* 3. Shrink + rotate into galaxy */
    await galaxyAnimation();

    await sleep(900);

    /* 4. Galaxy -> REAL PIXEL COORDINATES */
    await animate(
        gal,
        face,
        5600,
        {color:faceColor}
    );

    /* Hold portrait */
    await sleep(3200);

    /* 5. Face -> heart */
    await animate(
        face,
        heart,
        4800,
        {color:heartColor}
    );

    /* 6. Heart beats */
    await heartbeat();

    /* 7. Message */
    message.innerHTML=`
        <div class="main">I like you.</div>
        <div class="sub">
            That's all.<br>
            I just wanted you to know.
        </div>
    `;

    message.style.opacity="1";
}

start.addEventListener("click",run);

ctx.clearRect(0,0,W,H);
drawBG();

</script>
</body>
</html>
